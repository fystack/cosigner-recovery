name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  WAILS_VERSION: v2.16.0

jobs:
  gui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            name: linux-amd64
            tags: webkit2_41
          - os: macos-latest
            platform: darwin/universal
            name: macos-universal
          - os: windows-latest
            platform: windows/amd64
            name: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build
        shell: bash
        run: |
          args="-platform ${{ matrix.platform }} -clean -trimpath"
          if [ -n "${{ matrix.tags }}" ]; then args="$args -tags ${{ matrix.tags }}"; fi
          wails build $args

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          case "${{ runner.os }}" in
            macOS) ditto -c -k --keepParent build/bin/recovery.app "dist/recovery-${{ matrix.name }}.zip" ;;
            Windows) cp build/bin/recovery.exe "dist/recovery-${{ matrix.name }}.exe" ;;
            Linux) tar -czf "dist/recovery-${{ matrix.name }}.tar.gz" -C build/bin recovery ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: recovery-${{ matrix.name }}
          path: dist/*

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # main.go embeds frontend/dist, which is gitignored
      - run: mkdir -p frontend/dist && touch frontend/dist/.keep

      - run: go test ./...

      - name: Cross-compile
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w" \
              -o "dist/recover-cli-${os}-${arch}${ext}" ./cmd/recover-cli
          done

      - uses: actions/upload-artifact@v4
        with:
          name: recover-cli
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gui, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
